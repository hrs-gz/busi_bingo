<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MFAH Bingo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        
        .bingo-prompt-text {
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }
        
        .bingo-loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: bingo-spin 1s linear infinite;
        }
        @keyframes bingo-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        /* Smooth fade for modal */
        .fade-enter { opacity: 0; transform: scale(0.95); }
        .fade-enter-active { opacity: 1; transform: scale(1); transition: opacity 200ms, transform 200ms; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center overflow-x-hidden selection:bg-green-500 selection:text-white">

    <!-- MFAH Header -->
    <header class="w-full text-center py-4 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30">
        <h1 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 inline-block">
            MFAH Photo Bingo
        </h1>
        <div id="bingo-status" class="text-[10px] font-medium text-slate-500 mt-1.5 h-3 uppercase tracking-wider opacity-0 transition-opacity duration-300">Ready</div>
    </header>

    <!-- Main Content -->
    <div class="w-full max-w-md flex-grow flex flex-col p-4 gap-4 justify-start items-center">
        
        <!-- The Board -->
        <div id="bingo-board" class="grid grid-cols-5 gap-1.5 w-full aspect-square bg-slate-900 p-2 rounded-2xl shadow-2xl shadow-black/50 border border-slate-800">
            <!-- Squares generated by JS -->
        </div>

        <!-- Modern Action Bar -->
        <div class="w-full grid grid-cols-2 gap-4 mt-2">
            <!-- Reset Button -->
            <button onclick="resetBingo()" class="group relative overflow-hidden rounded-full bg-slate-800 border border-slate-700 text-slate-300 py-3.5 font-semibold text-sm transition-all active:scale-95 hover:bg-slate-750 hover:text-white hover:border-slate-600 shadow-lg">
                <div class="flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="opacity-70 group-hover:opacity-100 transition-opacity"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    <span>Reset Board</span>
                </div>
            </button>

            <!-- Save Button -->
            <button onclick="exportBingo()" id="bingo-export-btn" class="group relative overflow-hidden rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 text-white py-3.5 font-bold text-sm shadow-lg shadow-emerald-900/20 transition-all active:scale-95 hover:shadow-emerald-500/25 hover:brightness-110">
                <div class="flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                    <span>Save Image</span>
                </div>
            </button>
        </div>
    </div>

    <!-- Hidden File Input -->
    <input type="file" id="bingo-file-input" accept="image/*" capture="environment" class="hidden">

    <!-- Edit Modal -->
    <div id="bingo-modal" class="fixed inset-0 bg-slate-950/80 hidden items-center justify-center z-50 p-6 backdrop-blur-sm transition-all duration-200 opacity-0 scale-95">
        <div class="bg-slate-900 rounded-3xl p-6 w-full max-w-xs border border-slate-800 shadow-2xl flex flex-col gap-3 relative overflow-hidden">
            <!-- Decorative gloss -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-emerald-500 via-cyan-500 to-blue-500"></div>
            
            <h3 class="text-xl font-bold text-center mb-2 text-white">Edit Square</h3>
            
            <button id="bingo-change-btn" class="bg-slate-800 text-emerald-400 border border-slate-700 hover:bg-slate-750 hover:border-emerald-500/50 py-3.5 rounded-xl font-semibold active:scale-98 transition-all flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                Retake Photo
            </button>
            
            <button id="bingo-delete-btn" class="bg-slate-800 text-red-400 border border-slate-700 hover:bg-red-900/20 hover:border-red-500/30 py-3.5 rounded-xl font-semibold active:scale-98 transition-all flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                Clear Square
            </button>
            
            <button onclick="closeBingoModal()" class="mt-2 text-slate-500 font-medium text-sm hover:text-slate-300 py-2 transition-colors">
                Cancel
            </button>
        </div>
    </div>

    <!-- Hidden Export Template (High Resolution) -->
    <div style="position: absolute; left: -9999px; top: 0;">
        <div id="bingo-export-container" class="bg-white p-12 w-[1200px] font-sans">
            <div class="mb-8 text-center border-b-8 border-slate-900 pb-8">
                <h1 id="bingo-export-title" class="text-6xl font-black text-slate-900 tracking-tighter uppercase mb-2">Museum of Fine Arts Houston</h1>
                <div class="flex items-center justify-center gap-4 text-slate-500 text-2xl font-bold tracking-widest uppercase">
                    <span class="text-slate-900 px-3 py-1 rounded-md">BINGO</span>
                    <span>•</span>
                    <span id="bingo-export-date"></span>
                </div>
            </div>
            <div id="bingo-export-grid" class="grid grid-cols-5 gap-4 bg-slate-100 p-4 border-8 border-slate-900 rounded-xl">
                <!-- Export content populates here -->
            </div>
        </div>
    </div>

    <script>
        // --- BINGO CONFIGURATION ---
        const bingoDatabaseName = 'bingo';
        const bingoDatabaseVersion = 1;
        const bingoStoreName = 'bingo';
        const bingoPromptStorageKey = 'bingo';
        const bingoCenterIndex = 12;
        const bingoSquareCount = 25;

        const bingoConfig = {
            name: "Museum of Fine Arts Houston",
            displayName: "MFAH",
            centerPrompt: "Cafe Employee!",
            pool: [
                "Picasso: The Yellow Sweater",
                "Paul Klee Artwork",
                "Matisse Cut-Out",
                "You as a Painting",
                "You as a Sculpture",
                "Lady on a Red Sofa",
                "Frankenthaler: Venetian Story",
                "You in the Wiggle Screen",
                "Project Row Houses Artwork",
                "Eye on Houston Photo",
                "Latin American Artwork",
                "Anish Kapoor: Cloud Column",
                "Cullen Sculpture Garden",
                "PNC Roof Garden Skyline",
                "Glassell Sloped Roof",
                "Brown Foundation Plaza Fountain",
                "Selfie with a Guard!",
                "Kinder Glass-Tube Facade",
                "Kinder Reflecting Pool",
                "High Five a Stranger",
                "Beck Building Entrance",
                "Museum Tunnel",
                "Artwork Over 1,000 Years Old",
                "Houston Artist Artwork",
                "Group Pose by a Sculpture"
            ]
        };

        // --- BINGO STATE ---
        let bingoDatabase = null;
        let bingoDatabasePromise = null;
        let bingoPhotos = new Array(bingoSquareCount).fill(null);
        let bingoActiveIndex = null;
        let bingoPrompts = new Array(bingoSquareCount).fill("");

        // --- BINGO DOM ELEMENTS ---
        let bingoBoardElement;
        let bingoFileInput;
        let bingoModal;
        let bingoStatusElement;

        // --- BINGO UTILITIES ---
        function showBingoStatus(message) {
            if (!bingoStatusElement) return;

            bingoStatusElement.innerText = message;
            bingoStatusElement.style.opacity = '1';
            window.setTimeout(() => {
                bingoStatusElement.style.opacity = '0';
            }, 3000);
        }

        function shuffleBingoItems(items) {
            const shuffledItems = [...items];
            for (let index = shuffledItems.length - 1; index > 0; index--) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [shuffledItems[index], shuffledItems[randomIndex]] = [shuffledItems[randomIndex], shuffledItems[index]];
            }
            return shuffledItems;
        }

        function buildBingoPrompts() {
            const availablePrompts = bingoConfig.pool.filter(
                prompt => prompt !== bingoConfig.centerPrompt
            );

            if (availablePrompts.length < bingoSquareCount - 1) {
                throw new Error('The bingo prompt pool must contain at least 24 unique non-center prompts.');
            }

            const selectedPrompts = shuffleBingoItems(availablePrompts).slice(0, bingoSquareCount - 1);
            const newPrompts = [];
            let selectedIndex = 0;

            for (let index = 0; index < bingoSquareCount; index++) {
                newPrompts.push(
                    index === bingoCenterIndex
                        ? bingoConfig.centerPrompt
                        : selectedPrompts[selectedIndex++]
                );
            }

            return newPrompts;
        }

        function loadOrCreateBingoPrompts() {
            try {
                const savedPrompts = localStorage.getItem(bingoPromptStorageKey);
                if (savedPrompts) {
                    const parsedPrompts = JSON.parse(savedPrompts);
                    if (
                        Array.isArray(parsedPrompts) &&
                        parsedPrompts.length === bingoSquareCount &&
                        parsedPrompts.every(prompt => typeof prompt === 'string')
                    ) {
                        bingoPrompts = parsedPrompts;
                        return;
                    }
                }
            } catch (error) {
                console.error('Unable to load saved bingo prompts:', error);
            }

            bingoPrompts = buildBingoPrompts();
            saveBingoPrompts();
        }

        function saveBingoPrompts() {
            try {
                localStorage.setItem(bingoPromptStorageKey, JSON.stringify(bingoPrompts));
            } catch (error) {
                console.error('Unable to save bingo prompts:', error);
                showBingoStatus('Prompts could not be saved.');
            }
        }

        function regenerateBingoPrompts() {
            try {
                localStorage.removeItem(bingoPromptStorageKey);
            } catch (error) {
                console.error('Unable to clear saved bingo prompts:', error);
            }

            bingoPrompts = buildBingoPrompts();
            saveBingoPrompts();
        }

        // --- BINGO INDEXED DATABASE ---
        function initializeBingoDatabase() {
            if (bingoDatabasePromise) return bingoDatabasePromise;

            bingoDatabasePromise = new Promise((resolve, reject) => {
                if (!('indexedDB' in window)) {
                    reject(new Error('IndexedDB is not supported by this browser.'));
                    return;
                }

                const request = indexedDB.open(bingoDatabaseName, bingoDatabaseVersion);

                request.onupgradeneeded = event => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(bingoStoreName)) {
                        database.createObjectStore(bingoStoreName);
                    }
                };

                request.onsuccess = event => {
                    bingoDatabase = event.target.result;
                    bingoDatabase.onversionchange = () => {
                        bingoDatabase.close();
                        bingoDatabase = null;
                        bingoDatabasePromise = null;
                    };
                    resolve(bingoDatabase);
                };

                request.onerror = () => {
                    reject(request.error || new Error('Unable to open the bingo database.'));
                };

                request.onblocked = () => {
                    showBingoStatus('Close other bingo tabs and reload.');
                };
            });

            const currentPromise = bingoDatabasePromise;
            currentPromise.catch(() => {
                if (bingoDatabasePromise === currentPromise) {
                    bingoDatabasePromise = null;
                }
            });

            return currentPromise;
        }

        async function runBingoDatabaseTransaction(mode, operation) {
            const database = await initializeBingoDatabase();

            return new Promise((resolve, reject) => {
                const transaction = database.transaction(bingoStoreName, mode);
                const store = transaction.objectStore(bingoStoreName);
                let request;

                try {
                    request = operation(store);
                } catch (error) {
                    reject(error);
                    return;
                }

                transaction.oncomplete = () => resolve(request ? request.result : undefined);
                transaction.onerror = () => reject(transaction.error || new Error('Bingo database transaction failed.'));
                transaction.onabort = () => reject(transaction.error || new Error('Bingo database transaction was aborted.'));
            });
        }

        async function saveBingoPhoto(index, imageData) {
            try {
                await runBingoDatabaseTransaction('readwrite', store => store.put(imageData, index));
                showBingoStatus('Photo saved.');
            } catch (error) {
                console.error('Unable to save bingo photo:', error);
                showBingoStatus('Photo could not be saved.');
            }
        }

        async function deleteBingoPhoto(index) {
            try {
                await runBingoDatabaseTransaction('readwrite', store => store.delete(index));
                showBingoStatus('Photo cleared.');
            } catch (error) {
                console.error('Unable to delete bingo photo:', error);
                showBingoStatus('Photo could not be cleared.');
            }
        }

        async function loadBingoPhotos() {
            try {
                const database = await initializeBingoDatabase();

                await new Promise((resolve, reject) => {
                    const transaction = database.transaction(bingoStoreName, 'readonly');
                    const request = transaction.objectStore(bingoStoreName).openCursor();

                    request.onsuccess = event => {
                        const cursor = event.target.result;
                        if (!cursor) return;

                        const index = Number(cursor.key);
                        if (Number.isInteger(index) && index >= 0 && index < bingoSquareCount) {
                            bingoPhotos[index] = cursor.value;
                            updateBingoSquare(index, cursor.value);
                        }
                        cursor.continue();
                    };

                    transaction.oncomplete = resolve;
                    transaction.onerror = () => reject(transaction.error || new Error('Unable to load bingo photos.'));
                    transaction.onabort = () => reject(transaction.error || new Error('Loading bingo photos was aborted.'));
                });
            } catch (error) {
                console.error('Unable to load bingo database:', error);
                showBingoStatus('Saved photos could not be loaded.');
            }
        }

        async function clearBingoDatabase() {
            try {
                await runBingoDatabaseTransaction('readwrite', store => store.clear());
            } catch (error) {
                console.error('Unable to clear bingo database:', error);
                showBingoStatus('Saved photos could not be cleared.');
                throw error;
            }
        }

        // --- BINGO BOARD ---
        function renderBingoBoard() {
            bingoBoardElement.innerHTML = '';

            bingoPrompts.forEach((prompt, index) => {
                const square = document.createElement('div');
                square.id = `bingo-square-${index}`;

                const centerClasses = index === bingoCenterIndex
                    ? 'bg-gradient-to-br from-emerald-700 to-emerald-900 shadow-inner'
                    : 'bg-slate-800 shadow-sm';

                square.className = `relative w-full pt-[100%] rounded-xl overflow-hidden cursor-pointer transition-all duration-200 active:scale-95 hover:brightness-110 ${centerClasses}`;
                square.onclick = () => handleBingoSquareClick(index);

                square.innerHTML = `
                    <div class="absolute inset-0 flex items-center justify-center p-1.5 z-10 pointer-events-none">
                        <span class="bingo-prompt-text text-[10px] sm:text-xs font-semibold text-center leading-tight break-words text-slate-200/90">${prompt}</span>
                    </div>
                    <div class="absolute inset-0 bg-cover bg-center z-0 hidden transition-opacity duration-500" id="bingo-image-${index}"></div>
                    <div class="absolute inset-0 bg-black/20 z-0 hidden" id="bingo-overlay-${index}"></div>
                    <div id="bingo-loading-${index}" class="hidden absolute inset-0 flex items-center justify-center bg-slate-900/80 z-20 backdrop-blur-sm"><div class="bingo-loader"></div></div>
                    <div id="bingo-check-${index}" class="hidden absolute top-1.5 right-1.5 z-20 bg-emerald-500 text-white rounded-full p-0.5 shadow-md transform scale-0 transition-transform duration-300">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="4"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                `;

                bingoBoardElement.appendChild(square);

                if (bingoPhotos[index]) {
                    updateBingoSquare(index, bingoPhotos[index]);
                }
            });
        }

        function handleBingoSquareClick(index) {
            bingoActiveIndex = index;
            bingoFileInput.dataset.index = String(index);

            if (bingoPhotos[index]) {
                openBingoModal();
            } else {
                triggerBingoFileUpload();
            }
        }

        function triggerBingoFileUpload() {
            bingoFileInput.value = '';
            bingoFileInput.click();
        }

        function updateBingoSquare(index, imageData) {
            const square = document.getElementById(`bingo-square-${index}`);
            if (!square) return;

            const imageElement = document.getElementById(`bingo-image-${index}`);
            const overlayElement = document.getElementById(`bingo-overlay-${index}`);
            const checkElement = document.getElementById(`bingo-check-${index}`);
            const promptElement = square.querySelector('.bingo-prompt-text');

            if (imageElement) {
                imageElement.style.backgroundImage = `url(${imageData})`;
                imageElement.classList.remove('hidden');
            }
            if (overlayElement) overlayElement.classList.remove('hidden');
            if (checkElement) {
                checkElement.classList.remove('hidden');
                window.setTimeout(() => checkElement.classList.remove('scale-0'), 50);
            }
            if (promptElement) promptElement.classList.add('opacity-0');

            square.classList.add('ring-2', 'ring-emerald-500', 'ring-offset-2', 'ring-offset-slate-900');
        }

        function clearBingoSquare(index) {
            const square = document.getElementById(`bingo-square-${index}`);
            if (!square) return;

            const imageElement = document.getElementById(`bingo-image-${index}`);
            const overlayElement = document.getElementById(`bingo-overlay-${index}`);
            const checkElement = document.getElementById(`bingo-check-${index}`);
            const loadingElement = document.getElementById(`bingo-loading-${index}`);
            const promptElement = square.querySelector('.bingo-prompt-text');

            if (imageElement) {
                imageElement.style.backgroundImage = '';
                imageElement.classList.add('hidden');
            }
            if (overlayElement) overlayElement.classList.add('hidden');
            if (loadingElement) loadingElement.classList.add('hidden');
            if (checkElement) {
                checkElement.classList.add('scale-0');
                window.setTimeout(() => checkElement.classList.add('hidden'), 200);
            }
            if (promptElement) promptElement.classList.remove('opacity-0');

            square.classList.remove('ring-2', 'ring-emerald-500', 'ring-offset-2', 'ring-offset-slate-900');
        }

        // --- BINGO IMAGE HANDLING ---
        function setupBingoFileInput() {
            bingoFileInput.addEventListener('change', event => {
                const file = event.target.files?.[0];
                const datasetIndex = Number.parseInt(bingoFileInput.dataset.index || '', 10);
                const index = bingoActiveIndex ?? datasetIndex;

                if (!file || !Number.isInteger(index) || index < 0 || index >= bingoSquareCount) return;
                if (!file.type.startsWith('image/')) {
                    showBingoStatus('Choose an image file.');
                    return;
                }

                const loadingElement = document.getElementById(`bingo-loading-${index}`);
                loadingElement?.classList.remove('hidden');

                const reader = new FileReader();

                reader.onload = loadEvent => {
                    const image = new Image();

                    image.onload = async () => {
                        try {
                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext('2d');
                            if (!context) throw new Error('Canvas is unavailable.');

                            const maximumSize = 1000;
                            let width = image.naturalWidth || image.width;
                            let height = image.naturalHeight || image.height;

                            if (!width || !height) throw new Error('The selected image has invalid dimensions.');

                            const scale = Math.min(1, maximumSize / Math.max(width, height));
                            width = Math.max(1, Math.round(width * scale));
                            height = Math.max(1, Math.round(height * scale));

                            canvas.width = width;
                            canvas.height = height;
                            context.drawImage(image, 0, 0, width, height);

                            const imageData = canvas.toDataURL('image/jpeg', 0.8);
                            bingoPhotos[index] = imageData;
                            updateBingoSquare(index, imageData);
                            await saveBingoPhoto(index, imageData);
                        } catch (error) {
                            console.error('Unable to process bingo photo:', error);
                            showBingoStatus('Photo could not be processed.');
                        } finally {
                            loadingElement?.classList.add('hidden');
                        }
                    };

                    image.onerror = () => {
                        loadingElement?.classList.add('hidden');
                        showBingoStatus('Photo could not be opened.');
                    };

                    image.src = String(loadEvent.target?.result || '');
                };

                reader.onerror = () => {
                    loadingElement?.classList.add('hidden');
                    showBingoStatus('Photo could not be read.');
                };

                reader.readAsDataURL(file);
            });
        }

        // --- BINGO MODAL ---
        function openBingoModal() {
            bingoModal.classList.remove('hidden');
            void bingoModal.offsetWidth;
            bingoModal.classList.remove('opacity-0', 'scale-95');
            bingoModal.classList.add('flex', 'opacity-100', 'scale-100');
        }

        function closeBingoModal() {
            bingoModal.classList.remove('opacity-100', 'scale-100');
            bingoModal.classList.add('opacity-0', 'scale-95');

            window.setTimeout(() => {
                bingoModal.classList.add('hidden');
                bingoModal.classList.remove('flex');
            }, 200);
        }

        function setupBingoModal() {
            document.getElementById('bingo-change-btn').onclick = () => {
                closeBingoModal();
                window.setTimeout(triggerBingoFileUpload, 250);
            };

            document.getElementById('bingo-delete-btn').onclick = async () => {
                const index = bingoActiveIndex;
                if (index === null) {
                    closeBingoModal();
                    return;
                }

                bingoPhotos[index] = null;
                clearBingoSquare(index);
                closeBingoModal();
                await deleteBingoPhoto(index);
            };

            bingoModal.addEventListener('click', event => {
                if (event.target === bingoModal) closeBingoModal();
            });
        }

        async function resetBingo() {
            if (!window.confirm('Start a new game? This will clear all photos and shuffle prompts.')) return;

            try {
                await clearBingoDatabase();
                bingoPhotos = new Array(bingoSquareCount).fill(null);
                bingoActiveIndex = null;
                regenerateBingoPrompts();
                renderBingoBoard();
                showBingoStatus('Board reset!');
            } catch (error) {
                // The database error is already surfaced by clearBingoDatabase.
            }
        }

        // --- BINGO EXPORT ---
        async function exportBingo() {
            const button = document.getElementById('bingo-export-btn');
            const originalHtml = button.innerHTML;

            button.innerHTML = '<div class="bingo-loader"></div>';
            button.disabled = true;

            try {
                const exportGrid = document.getElementById('bingo-export-grid');
                exportGrid.innerHTML = '';
                document.getElementById('bingo-export-date').innerText = new Date().toLocaleDateString();
                document.getElementById('bingo-export-title').textContent = bingoConfig.name;

                bingoPrompts.forEach((prompt, index) => {
                    const square = document.createElement('div');
                    square.className = 'aspect-square bg-slate-200 flex items-center justify-center relative border-2 border-slate-300 overflow-hidden rounded-lg';

                    if (bingoPhotos[index]) {
                        square.innerHTML = `
                            <div class="absolute inset-0 bg-cover bg-center" style="background-image: url(${bingoPhotos[index]})"></div>
                            <div class="absolute bottom-0 left-0 right-0 bg-slate-900/80 p-1.5">
                                <p class="text-white text-[12px] font-bold text-center leading-none truncate font-sans">${prompt}</p>
                            </div>
                        `;
                        square.style.borderColor = '#10b981';
                    } else {
                        square.innerHTML = `<div class="p-2"><p class="text-slate-400 text-[12px] text-center font-bold leading-tight uppercase tracking-wide">${prompt}</p></div>`;
                    }

                    exportGrid.appendChild(square);
                });

                await new Promise(resolve => window.setTimeout(resolve, 100));

                const canvas = await html2canvas(document.getElementById('bingo-export-container'), {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });

                const safeName = bingoConfig.displayName.replace(/\s+/g, '-');
                const link = document.createElement('a');
                link.download = `${safeName}-Bingo-${new Date().toISOString().slice(0, 10)}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
            } catch (error) {
                console.error('Unable to export bingo image:', error);
                window.alert('Could not save image. Try again.');
            } finally {
                button.innerHTML = originalHtml;
                button.disabled = false;
            }
        }

        // --- BINGO INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            bingoBoardElement = document.getElementById('bingo-board');
            bingoFileInput = document.getElementById('bingo-file-input');
            bingoModal = document.getElementById('bingo-modal');
            bingoStatusElement = document.getElementById('bingo-status');

            document.title = `${bingoConfig.displayName} Bingo`;
            loadOrCreateBingoPrompts();
            setupBingoFileInput();
            setupBingoModal();
            renderBingoBoard();
            loadBingoPhotos();
        });
    </script>
</body>
</html>
